<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>케이카 AI매입시스템 | K Car Smart Purchase</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 통합 인라인 스타일시트 -->
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --kcar-red: #E60024;
      --kcar-red-glow: rgba(230, 0, 36, 0.35);
      --kcar-red-dark: #B3001C;
      --accent-cyan: #00F0FF;
      --accent-purple: #8A2BE2;
      --bg-dark: #0B0E14;
      --card-bg: rgba(23, 27, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
    }

    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #06080D;
      color: #F3F4F6;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(230, 0, 36, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.06) 0%, transparent 60%);
      background-attachment: fixed;
    }

    /* 화면 전환 제어 클래스 (Tailwind hidden 충돌 방지용) */
    .screen-view {
      display: none !important;
    }
    .screen-view.active-flex {
      display: flex !important;
    }
    .screen-view.active-block {
      display: block !important;
    }

    /* 모바일 전용 컨테이너 */
    .mobile-wrapper {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #0D111A;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 글래스모피즘 카드 */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
    }

    .glass-panel-glow {
      background: linear-gradient(135deg, rgba(230, 0, 36, 0.15), rgba(23, 27, 38, 0.95));
      border: 1px solid rgba(230, 0, 36, 0.35);
      box-shadow: 0 8px 32px rgba(230, 0, 36, 0.2);
      backdrop-filter: blur(16px);
      border-radius: 20px;
    }

    .glass-panel-cyan {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(23, 27, 38, 0.95));
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 20px;
    }

    /* 케이카 레드 그라디언트 버튼 */
    .btn-kcar {
      background: linear-gradient(135deg, #FF1E40 0%, #D60020 100%);
      box-shadow: 0 6px 20px rgba(230, 0, 36, 0.45);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-kcar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(230, 0, 36, 0.65);
    }

    .btn-kcar:active {
      transform: translateY(1px);
    }

    /* 네온 텍스트 효과 */
    .neon-text-red {
      color: #FF4D66;
      text-shadow: 0 0 12px rgba(255, 30, 64, 0.6);
    }

    /* 차량 번호판 스타일 */
    .license-plate {
      background: linear-gradient(180deg, #FFFFFF 0%, #E8EDF5 100%);
      color: #111827;
      font-weight: 800;
      letter-spacing: 3px;
      border: 2.5px solid #1E293B;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.9), 0 8px 25px rgba(0,0,0,0.6);
      border-radius: 12px;
      position: relative;
    }

    .license-plate::before {
      content: 'KOR';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      font-weight: 900;
      color: #1D4ED8;
      letter-spacing: 0px;
      background: #E0E7FF;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #93C5FD;
    }

    /* 스캔 레이더 애니메이션 */
    @keyframes scanline {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 96%; opacity: 0.8; }
    }

    .scan-beam {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00F0FF, #FF1E40, transparent);
      box-shadow: 0 0 15px #00F0FF, 0 0 30px #FF1E40;
      animation: scanline 2s ease-in-out infinite alternate;
    }

    /* 커스텀 슬라이더 */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: #1F2937;
      border-radius: 6px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FF1E40;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 30, 64, 0.8);
      border: 2px solid #FFFFFF;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* 펄스 뱃지 */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .pulse-badge {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    /* 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-gray-100 flex justify-center">

  <!-- 모바일 중심 컨테이너 -->
  <div class="mobile-wrapper relative flex flex-col justify-between">
    
    <!-- 1. 상단 글로벌 네비게이션 헤더 -->
    <header class="sticky top-0 z-40 bg-[#0D111A]/90 backdrop-blur-md border-b border-white/10 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#FF1E40] to-[#990014] flex items-center justify-center shadow-lg shadow-red-900/40">
          <i data-lucide="zap" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-extrabold text-sm tracking-tight text-white">K Car</span>
            <span class="text-[10px] bg-red-600/30 text-red-400 font-bold px-1.5 py-0.5 rounded border border-red-500/30">AI 매입</span>
          </div>
          <p class="text-[10px] text-gray-400 font-medium">직영차량 정밀진단 & 시세산정</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div id="userBadge" style="display: none;" class="items-center gap-1.5 bg-white/5 border border-white/10 px-2.5 py-1 rounded-full text-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-gray-300 font-medium text-[11px]">김케이 매입관</span>
        </div>
        <button id="resetAppBtn" onclick="resetToHome()" style="display: none;" class="text-gray-400 hover:text-white p-1.5 rounded-lg bg-white/5 border border-white/10 text-xs">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative p-4">

      <!-- ============================================== -->
      <!-- [화면 1] 내부 시스템 로그인 화면 -->
      <!-- ============================================== -->
      <section id="loginScreen" class="screen-view active-flex py-8 flex-col items-center justify-center min-h-[78vh] space-y-6">
        <div class="text-center space-y-3">
          <div class="inline-flex p-4 rounded-3xl bg-gradient-to-br from-red-600/20 to-purple-600/10 border border-red-500/30 shadow-2xl shadow-red-600/20 mb-1">
            <i data-lucide="shield-check" class="w-12 h-12 text-[#FF1E40]"></i>
          </div>
          <h1 class="text-2xl font-black tracking-tight text-white">케이카 AI매입시스템</h1>
          <p class="text-xs text-gray-400 max-w-xs leading-relaxed">
            빅데이터 AI 사전 진단과 엔카·케이카 실시간 시세 결합 정밀 매입가격 산정 플랫폼
          </p>
        </div>

        <div class="w-full glass-panel-glow p-6 space-y-4">
          <div class="flex items-center justify-between pb-2 border-b border-white/10">
            <span class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
              <i data-lucide="lock" class="w-3.5 h-3.5 text-red-400"></i>
              매입사원 통합 인증
            </span>
            <span class="text-[10px] text-red-300 bg-red-950/80 px-2 py-0.5 rounded-full border border-red-800/50">내부보안시스템</span>
          </div>

          <div class="space-y-3.5">
            <div>
              <label class="block text-[11px] font-semibold text-gray-400 mb-1">사원 번호 (ID)</label>
              <div class="relative">
                <i data-
