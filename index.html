<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>케이카 AI매입시스템 | K Car Smart Purchase</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 통합 인라인 스타일시트 -->
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root {
      --kcar-red: #E60024;
      --kcar-red-glow: rgba(230, 0, 36, 0.35);
      --kcar-red-dark: #B3001C;
      --accent-cyan: #00F0FF;
      --accent-purple: #8A2BE2;
      --bg-dark: #0B0E14;
      --card-bg: rgba(23, 27, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
    }
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #06080D;
      color: #F3F4F6;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(230, 0, 36, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.06) 0%, transparent 60%);
      background-attachment: fixed;
    }
    /* 화면 전환 제어 클래스 (Tailwind hidden 충돌 방지용) */
    .screen-view {
      display: none !important;
    }
    .screen-view.active-flex {
      display: flex !important;
    }
    .screen-view.active-block {
      display: block !important;
    }
    /* 모바일 전용 컨테이너 */
    .mobile-wrapper {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #0D111A;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }
